<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>University Research Opportunity Portal</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <h1>Research Opportunity Portal</h1>
    <p class="subtitle">FAST-NUCES Peshawar &middot; Computer Networks Assignment</p>
  </div>
</header>

<main class="container">
  <div id="toast" class="toast hidden"></div>

  <section class="panel">
    <div class="panel-header">
      <h2 id="form-title">Post a New Research Opportunity</h2>
      <button id="cancel-edit-btn" class="btn btn-ghost hidden" type="button">Cancel edit</button>
    </div>

    <form id="opportunity-form" novalidate>
      <input type="hidden" id="opportunity-id">

      <div class="form-grid">
        <label class="field">
          <span>Research Title *</span>
          <input type="text" id="title" required maxlength="200" placeholder="e.g. Machine Learning for Crop Yield Prediction">
        </label>

        <label class="field">
          <span>Research Area *</span>
          <input type="text" id="research_area" required maxlength="150" placeholder="e.g. Machine Learning">
        </label>

        <label class="field">
          <span>Faculty Member's Name *</span>
          <input type="text" id="faculty_name" required maxlength="150" placeholder="e.g. Dr. Ayesha Khan">
        </label>

        <label class="field">
          <span>Department *</span>
          <input type="text" id="department" required maxlength="150" placeholder="e.g. Computer Science">
        </label>

        <label class="field">
          <span>Required Skills *</span>
          <input type="text" id="required_skills" required maxlength="500" placeholder="e.g. Python, Data Analysis">
        </label>

        <label class="field">
          <span>Available Positions *</span>
          <input type="number" id="available_positions" required min="1" step="1">
        </label>

        <label class="field">
          <span>Application Deadline *</span>
          <input type="date" id="application_deadline" required>
        </label>

        <label class="field">
          <span>Status</span>
          <select id="status">
            <option value="Open">Open</option>
            <option value="Closed">Closed</option>
          </select>
        </label>
      </div>

      <label class="field">
        <span>Research Description *</span>
        <textarea id="description" required rows="4" maxlength="2000" placeholder="Describe the research opportunity..."></textarea>
      </label>

      <div id="form-errors" class="form-errors hidden"></div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="submit-btn">Create Opportunity</button>
      </div>
    </form>
  </section>

  <section class="panel">
    <div class="panel-header">
      <h2>All Research Opportunities</h2>
      <button id="refresh-btn" class="btn btn-ghost" type="button">Refresh</button>
    </div>
    <div id="list-status" class="muted">Loading opportunities...</div>
    <div id="opportunities-list" class="cards"></div>
  </section>
</main>

<div id="detail-modal" class="modal hidden">
  <div class="modal-backdrop" id="modal-backdrop"></div>
  <div class="modal-content">
    <button class="modal-close" id="modal-close-btn" type="button" aria-label="Close">&times;</button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
